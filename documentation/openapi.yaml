openapi: 3.1.0
info:
  title: OceanGuard API
  version: 1.0.0
  description: |
    OceanGuard ist ein Web Service, der in Echtzeit zeigt, ob Fischereifahrzeuge in Gebieten aktiver Fisch-Verbreitungszonen operieren.

    ### Externe Datenquellen (Aggregator)
    Unser Backend konsumiert drei externe APIs und bietet dem Frontend über eine saubere REST-Schnittstelle aufbereitete, kombinierte Daten an:

    * **OBIS (Ocean Biodiversity Information System):** Historische Sichtungsdaten (`api.obis.org/v3/occurrence`). Daraus berechnen wir saisonale Verbreitungszonen (Mittelpunkt pro Monat via Haversine).
    * **AISstream.io:** Echtzeit-Schiffspositionen via WebSocket (`wss://stream.aisstream.io/v0/stream`). Liefert `Latitude`, `Longitude` und `SpeedOverGround`. Wir filtern nach Fischereifahrzeugen (ShipType=30 oder NavigationalStatus=7). Die Subscription-Bbox wird dynamisch aus dem `radius_km` der jeweiligen Art berechnet.
    * **Open-Meteo Marine API:** Sea Surface Temperature (`marine-api.open-meteo.com/v1/marine`). Wird einmalig beim App-Start pro Art aus 3 Sampling-Punkten (Zonen-Zentrum + Nord + Süd bei 50% Radius) gemittelt und gecacht (TTL 24h). **Nicht pro Schiff abgerufen.**

    ### Kern-Feature: Overlap-Score
    Der Score beantwortet die Frage: *„Fahren gerade Fischereifahrzeuge genau dort, wo Fische saisonal wandern – und wie kritisch ist das?"*

    **Score = D × (A × 0.6 + T × 0.4)**

    * **D (Distanz-Gatekeeper):** `max(0, 1 - d / radius_km)` — Wie nah ist das Schiff an der Verbreitungszone? `radius_km` ist artspezifisch. D=0 wenn außerhalb → gesamter Score=0. Verhindert False Positives.
    * **A (Aktivität):** `max(0, 1 - sog / 10)` — Wie wahrscheinlich fischt das Schiff? Basiert auf AIS-Geschwindigkeit (< 10 Knoten).
    * **T (Temperatur):** `max(0, 1 - |sst - temp_mid| / temp_range)` — Passt die Wassertemperatur zum Optimum der Art? SST kommt aus dem 3-Punkte-Sampling-Cache.

    **Bewertung:** > 0.7 → KRITISCH | 0.4–0.7 → WARNUNG | < 0.4 → GERING

servers:
  - url: http://localhost:8000
    description: Lokaler Entwicklungsserver

tags:
  - name: Auth
    description: Firebase-basierte Authentifizierung
  - name: Species
    description: Fischarten – öffentlich lesbar, Admin-CRUD
  - name: Vessels
    description: Echtzeit-Fischereifahrzeuge via AISstream (Frei zugänglich)
  - name: Overlaps
    description: Kern-Feature – Overlap-Score Berechnung (Frei zugänglich)
  - name: Marine
    description: Meereskonditionen via Open-Meteo (Frei zugänglich)
  - name: Alerts
    description: Warnungen bei kritischem Overlap-Score (Frei zugänglich)
  - name: Favorites
    description: Gespeicherte Arten und Regionen (User Login benötigt)
  - name: Reports
    description: Gespeicherte Overlap-Snapshots (User Login benötigt)
  - name: Admin
    description: User-Verwaltung und System-Status (Admin Login benötigt)

paths:
  /auth/sync:
    post:
      tags:
        - Auth
      summary: User nach Firebase-Login synchronisieren
      description: |
        **Rolle: User (Mit Login)**
        Wird nach Firebase-Login aufgerufen. Legt den User in der eigenen Datenbank an (201) oder gibt den bestehenden User zurück (200). Das Backend führt außerdem einen Auto-Sync in `get_current_user()` durch – dieser Endpoint ist optional.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: User existiert bereits – wird zurückgegeben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '201':
          description: Neuer User wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags:
        - Auth
      summary: Aktuellen eingeloggten User abrufen
      description: |
        **Rolle: User (Mit Login)**
        Gibt die Profildaten des aktuell authentifizierten Users zurück.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aktueller User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout (client-seitig)
      description: |
        **Rolle: User (Mit Login)**
        Das eigentliche Logout passiert im Frontend via Firebase signOut(). Dieser Endpoint dient als REST-konforme Bestätigung.
      security:
        - BearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /species:
    get:
      tags:
        - Species
      summary: Alle aktiven Fischarten abrufen
      description: |
        **Rolle: Gast (Ohne Login)**
        Gibt alle aktiven Arten zurück.
      responses:
        '200':
          description: Liste aller aktiven Arten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpeciesResponse'
    post:
      tags:
        - Species
      summary: Neue Fischart anlegen
      description: |
        **Rolle: Admin**
        Erstellt einen neuen Eintrag für eine Fischart.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesCreate'
      responses:
        '201':
          description: Fischart erfolgreich angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /species/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        examples:
          default:
            value: thunnus-thynnus
    get:
      tags:
        - Species
      summary: Einzelne Fischart abrufen
      description: |
        **Rolle: Gast (Ohne Login)**
      responses:
        '200':
          description: Fischart gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Species
      summary: Fischart komplett aktualisieren
      description: |
        **Rolle: Admin**
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesCreate'
      responses:
        '200':
          description: Fischart aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
        - Species
      summary: Einzelne Felder der Fischart ändern
      description: |
        **Rolle: Admin**
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesPatch'
      responses:
        '200':
          description: Fischart aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
        - Species
      summary: Fischart deaktivieren (Soft-Delete)
      description: |
        **Rolle: Admin**
        Setzt active=false – kein hartes Löschen.
      security:
        - BearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /species/{id}/migration:
    get:
      tags:
        - Species
      summary: Saisonale Verbreitungszone einer Art abrufen
      description: |
        **Rolle: Gast (Ohne Login)**
        **Externe Datenquelle: OBIS API**

        Gibt die saisonale Verbreitungszone der Art für den angegebenen Monat zurück.
        Pro Art und Monat wird aus historischen Sichtungen der räumliche Mittelpunkt berechnet.
        Das Ergebnis ist ein GeoJSON-Kreis (Point + radius_km).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          examples:
            default:
              value: thunnus-thynnus
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          examples:
            default:
              value: 5
      responses:
        '200':
          description: Verbreitungszone als GeoJSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationZone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /vessels:
    get:
      tags:
        - Vessels
      summary: Fischereifahrzeuge in einer Region abrufen
      description: |
        **Rolle: Gast (Ohne Login)**
        **Externe Datenquelle: AISstream.io** (WebSocket, In-Memory-Cache)

        Gibt alle aktuell bekannten Fischereifahrzeuge aus dem In-Memory-Cache zurück.
        Die AIS-Subscription läuft im Hintergrund auf Bboxen, die aus den Zonen der aktiven Arten berechnet werden (Zone-Center ± radius_km).
      parameters:
        - name: bbox
          in: query
          required: false
          schema:
            type: string
          description: 'Optionaler Filter: lat1,lng1,lat2,lng2'
          examples:
            default:
              value: 35.0,10.0,46.0,20.0
      responses:
        '200':
          description: Liste der Fischereifahrzeuge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VesselResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /vessels/{mmsi}:
    get:
      tags:
        - Vessels
      summary: Einzelnes Schiff abrufen
      description: |
        **Rolle: Gast (Ohne Login)**
      parameters:
        - name: mmsi
          in: path
          required: true
          schema:
            type: string
          examples:
            default:
              value: '123456789'
      responses:
        '200':
          description: Schiff gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /overlaps:
    get:
      tags:
        - Overlaps
      summary: Overlap-Score für alle Schiffe berechnen
      description: |
        **Rolle: Gast (Ohne Login)**
        **Kern-Feature von OceanGuard. Aggregiert alle 3 externen APIs.**

        Berechnet für jedes Fischereifahrzeug den Overlap-Score zur angegebenen Art.

        **Score = D × (A × 0.6 + T × 0.4)**
        - D = max(0, 1 - d / radius_km) — artspezifischer Cutoff, D=0 außerhalb der Zone
        - A = max(0, 1 - sog / 10) — Aktivitätsfaktor via AIS-Geschwindigkeit
        - T = max(0, 1 - |sst - temp_mid| / temp_range) — SST aus gecachtem 3-Punkte-Sampling

        `month` ist optional — Default ist der aktuelle Monat.
      parameters:
        - name: species
          in: query
          required: true
          schema:
            type: string
          examples:
            default:
              value: thunnus-thynnus
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Monat (1–12). Default = aktueller Monat.
          examples:
            default:
              value: 5
      responses:
        '200':
          description: Overlap-Ergebnisse für alle Schiffe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlapListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /overlaps/{mmsi}:
    get:
      tags:
        - Overlaps
      summary: Detail-Overlap-Score für ein einzelnes Schiff
      description: |
        **Rolle: Gast (Ohne Login)**
        Zeigt aufgeschlüsselt, wie sich der Overlap-Score (D, A, T) für ein bestimmtes Schiff zusammensetzt.
      parameters:
        - name: mmsi
          in: path
          required: true
          schema:
            type: string
          examples:
            default:
              value: '123456789'
        - name: species
          in: query
          required: true
          schema:
            type: string
          examples:
            default:
              value: thunnus-thynnus
      responses:
        '200':
          description: Detail-Score mit D, A, T Komponenten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverlapDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /marine-conditions:
    get:
      tags:
        - Marine
      summary: Aktuelle Meereskonditionen abrufen
      description: |
        **Rolle: Gast (Ohne Login)**
        **Externe Datenquelle: Open-Meteo Marine API**

        Gibt die aktuelle Sea Surface Temperature (SST) für einen Punkt zurück.
        Intern wird die SST für den Overlap-Score aus dem 3-Punkte-Zonen-Cache verwendet.
        Dieser Endpoint erlaubt den direkten Abruf für einen beliebigen Punkt.
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
          examples:
            default:
              value: 41.5
        - name: lng
          in: query
          required: true
          schema:
            type: number
          examples:
            default:
              value: 15.3
      responses:
        '200':
          description: Meereskonditionen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarineConditionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /alerts:
    get:
      tags:
        - Alerts
      summary: Warnungen für kritische Overlap-Situationen
      description: |
       **Rolle: Gast (Ohne Login)**
        Liefert alle Schiffe mit Score ≥ 0.4 (WARNUNG oder KRITISCH).
        Schiffe mit Score < 0.4 (GERING) werden nicht zurückgegeben.
        Monat = aktueller Monat (automatisch).
      parameters:
        - name: species
          in: query
          required: true
          schema:
            type: string
          examples:
            default:
              value: thunnus-thynnus
      responses:
        '200':
          description: Liste der Warnungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /favorites/species:
    get:
      tags:
        - Favorites
      summary: Gespeicherte Arten-Favoriten abrufen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste der Favoriten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteSpeciesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Favorites
      summary: Fischart als Favorit speichern
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteSpeciesCreate'
      responses:
        '201':
          description: Favorit gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteSpeciesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /favorites/species/{species_id}:
    delete:
      tags:
        - Favorites
      summary: Arten-Favorit entfernen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      parameters:
        - name: species_id
          in: path
          required: true
          schema:
            type: string
          examples:
            default:
              value: thunnus-thynnus
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /favorites/regions:
    get:
      tags:
        - Favorites
      summary: Gespeicherte Regions-Favoriten abrufen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste der Regions-Favoriten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FavoriteRegionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Favorites
      summary: Region als Favorit speichern
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRegionCreate'
      responses:
        '201':
          description: Region gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRegionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/regions/{id}:
    delete:
      tags:
        - Favorites
      summary: Regions-Favorit entfernen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            default:
              value: 1
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reports:
    get:
      tags:
        - Reports
      summary: Alle gespeicherten Reports abrufen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste der Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Reports
      summary: Overlap-Snapshot als Report speichern
      description: |
        **Rolle: User (Mit Login)**
        Speichert eine aktuelle Overlap-Berechnung als Report ab.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
      responses:
        '201':
          description: Report gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reports/compare:
    get:
      tags:
        - Reports
      summary: Zwei Reports vergleichen
      description: |
        **Rolle: User (Mit Login)**
        Stellt zwei gespeicherte Reports gegenüber. Beide Reports müssen die gleiche Art haben.
      security:
        - BearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Kommagetrennte Report-IDs
          examples:
            default:
              value: 1,2
      responses:
        '200':
          description: Vergleich der beiden Reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCompareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reports/{id}:
    get:
      tags:
        - Reports
      summary: Einzelnen Report abrufen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            default:
              value: 1
      responses:
        '200':
          description: Report gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Reports
      summary: Report löschen
      description: |
        **Rolle: User (Mit Login)**
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            default:
              value: 1
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users:
    get:
      tags:
        - Admin
      summary: Alle User abrufen
      description: |
        **Rolle: Admin**
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste aller User
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}:
    delete:
      tags:
        - Admin
      summary: User löschen
      description: |
        **Rolle: Admin**
        Admin kann sich nicht selbst löschen (→ 403).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            default:
              value: 1
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{id}/role:
    patch:
      tags:
        - Admin
      summary: Rolle eines Users ändern
      description: |
        **Rolle: Admin**
        Aktualisiert die Zugriffsberechtigungen (guest, user, admin) eines Nutzers.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          examples:
            default:
              value: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - guest
                    - user
                    - admin
              required:
                - role
      responses:
        '200':
          description: Rolle aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/system:
    get:
      tags:
        - Admin
      summary: System-Status abrufen
      description: |
        **Rolle: Admin**
        Gibt Server-Metriken, Cache-Stats und Uptime zurück.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System-Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
      description: Firebase ID Token im Authorization Header. Token via get_token.py holen.

  responses:
    BadRequest:
      description: Ungültige Anfrage (fehlende oder falsche Parameter)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                detail: Bad request or validation error
    Unauthorized:
      description: Kein oder ungültiger Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                detail: Not authenticated
    Forbidden:
      description: Keine Berechtigung (falsche Rolle)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                detail: Role 'admin' required
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                detail: Not found
    Conflict:
      description: Ressourcenkonflikt (Datensatz existiert bereits)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                detail: Resource already exists
    UnprocessableEntity:
      description: Semantische Validierungsfehler in der Payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                detail: Unprocessable entity
    NoContent:
      description: Erfolgreich ausgeführt, keine Daten zurückgegeben

  schemas:
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string

    SyncRequest:
      type: object
      properties:
        name:
          type: string
          examples: ["John"]
      required:
        - name

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          examples: [1]
        email:
          type: string
          examples: ["john@example.com"]
        name:
          type: string
          examples: ["Jane Doe"]
        firebase_uid:
          type: string
          examples: ["firebase_uid_12345"]
        role:
          type: string
          enum:
            - guest
            - user
            - admin
          default: user
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - firebase_uid

    SpeciesCreate:
      type: object
      properties:
        id:
          type: string
          examples: ["thunnus-thynnus"]
        common_name:
          type: string
          examples: ["Roter Thun"]
        scientific_name:
          type: string
          examples: ["Thunnus thynnus"]
        region:
          type: string
          examples: ["Atlantik / Mittelmeer"]
        temp_min:
          type: number
          examples: [15.0]
        temp_max:
          type: number
          examples: [25.0]
        temp_mid:
          type: number
          examples: [22.0]
          description: Temperatur-Optimum der Art (Mitte des Optimalbereichs)
        temp_range:
          type: number
          examples: [10.0]
          description: Toleranzbreite R für T-Faktor im Overlap-Score
        radius_km:
          type: integer
          default: 200
          description: Zonen-Radius UND D-Cutoff im Score (Doppelfunktion)
      required:
        - id
        - common_name
        - scientific_name
        - region

    SpeciesPatch:
      type: object
      properties:
        common_name:
          type: string
        scientific_name:
          type: string
        region:
          type: string
        temp_min:
          type: number
        temp_max:
          type: number
        temp_mid:
          type: number
        temp_range:
          type: number
        radius_km:
          type: integer
        active:
          type: boolean

    SpeciesResponse:
      type: object
      properties:
        id:
          type: string
        common_name:
          type: string
        scientific_name:
          type: string
        region:
          type: string
        temp_min:
          type: number
        temp_max:
          type: number
        temp_mid:
          type: number
        temp_range:
          type: number
        radius_km:
          type: integer
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MigrationZone:
      type: object
      properties:
        type:
          type: string
          examples: ["Feature"]
        geometry:
          type: object
          properties:
            type:
              type: string
              examples: ["Point"]
            coordinates:
              type: array
              items:
                type: number
              examples: [[6.3, 40.1]]
        properties:
          type: object
          properties:
            species_id:
              type: string
              examples: ["thunnus-thynnus"]
            month:
              type: integer
              examples: [5]
            radius_km:
              type: integer
              examples: [200]
            sighting_count:
              type: integer
              examples: [143]

    VesselResponse:
      type: object
      properties:
        mmsi:
          type: string
          examples: ["123456789"]
        vessel_name:
          type: string
          examples: ["FV Atlantic Star"]
        lat:
          type: number
          examples: [42.3]
        lng:
          type: number
          examples: [5.1]
        sog:
          type: number
          examples: [2.4]

    OverlapDetailResponse:
      type: object
      properties:
        mmsi:
          type: string
        vessel_name:
          type: string
        lat:
          type: number
        lng:
          type: number
        sog:
          type: number
        score:
          type: number
          examples: [0.87]
          description: "Score = D × (A × 0.6 + T × 0.4)"
        D:
          type: number
          description: "Distanz-Faktor: max(0, 1 - d/radius_km)"
        A:
          type: number
          description: "Aktivitäts-Faktor: max(0, 1 - sog/10)"
        T:
          type: number
          description: "Temperatur-Faktor: max(0, 1 - |sst-temp_mid|/temp_range)"
        level:
          type: string
          enum: ["GERING", "WARNUNG", "KRITISCH"]
          examples: ["KRITISCH"]

    OverlapListResponse:
      type: object
      properties:
        vessels:
          type: array
          items:
            $ref: '#/components/schemas/OverlapDetailResponse'
        stats:
          type: object
          properties:
            count:
              type: integer
            avg_score:
              type: number
            max_score:
              type: number
        zone:
          type: object
          properties:
            center_lat:
              type: number
            center_lng:
              type: number
            radius_km:
              type: integer
            month:
              type: integer

    MarineConditionsResponse:
      type: object
      properties:
        sst:
          type: number
          description: Sea Surface Temperature in °C
          examples: [21.5]

    AlertResponse:
      type: object
      properties:
        mmsi:
          type: string
        vessel_name:
          type: string
        score:
          type: number
        level:
          type: string
          enum: ["WARNUNG", "KRITISCH"]
          examples: ["KRITISCH"]
        lat:
          type: number
        lng:
          type: number

    FavoriteSpeciesCreate:
      type: object
      properties:
        species_id:
          type: string
      required:
        - species_id

    FavoriteSpeciesResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        species_id:
          type: string
        created_at:
          type: string
          format: date-time

    FavoriteRegionCreate:
      type: object
      properties:
        name:
          type: string
        bbox:
          type: string
          description: "JSON: [lat1, lng1, lat2, lng2]"
      required:
        - name
        - bbox

    FavoriteRegionResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        bbox:
          type: string
        created_at:
          type: string
          format: date-time

    ReportCreate:
      type: object
      properties:
        species_id:
          type: string
        bbox:
          type: string
        month:
          type: integer
      required:
        - species_id
        - bbox
        - month

    ReportResponse:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        species_id:
          type: string
        bbox:
          type: string
        month:
          type: integer
        snapshot:
          type: string
          description: "JSON stringified OverlapListResponse"
        vessel_count:
          type: integer
        avg_score:
          type: number
        created_at:
          type: string
          format: date-time

    ReportCompareResponse:
      type: object
      properties:
        report_1:
          $ref: '#/components/schemas/ReportResponse'
        report_2:
          $ref: '#/components/schemas/ReportResponse'
        score_diff:
          type: number
        vessel_count_diff:
          type: integer

    SystemStatusResponse:
      type: object
      properties:
        user_count:
          type: integer
          examples: [42]
        species_count:
          type: integer
          examples: [4]
        active_vessels:
          type: integer
          examples: [17]
        cached_zones:
          type: integer
          examples: [48]
        ais_connected:
          type: boolean
          examples: [true]
        last_ais_message_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          examples: [3600]