openapi: 3.1.0
info:
  title: OceanGuard API
  description: Backend for monitoring maritime conservation zones
  version: 1.0.0
paths:
  /auth/sync:
    post:
      tags:
      - Auth
      summary: Firebase-User synchronisieren
      description: 'Verifiziert Firebase-Token und erstellt/aktualisiert User in lokaler
        DB. **Rolle: Alle mit gültigem Token.**'
      operationId: sync_user_auth_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
        required: true
      responses:
        '200':
          description: User existiert bereits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '201':
          description: Neuer User erstellt
        '401':
          description: Token ungültig
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /auth/me:
    get:
      tags:
      - Auth
      summary: Aktuellen User abrufen
      description: 'Gibt den eingeloggten User zurück. **Rolle: User/Admin.**'
      operationId: get_me_auth_me_get
      responses:
        '200':
          description: User-Daten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Nicht eingeloggt
      security:
      - HTTPBearer: []
  /species/:
    get:
      tags:
      - Species
      summary: Alle aktiven Fischarten abrufen
      description: 'Gibt alle aktiven Arten mit relativen HATEOAS-Links zurück. Unterstützt
        ETag Caching. **Rolle: Gast.**'
      operationId: get_all_species_species__get
      responses:
        '200':
          description: Liste aller aktiven Arten mit HATEOAS-Links und Caching-Headern
          headers:
            ETag:
              description: Weak entity tag for conditional requests (e.g., W/"abc123...")
            Cache-Control:
              description: public, max-age=86400 (cacheable for 24 hours)
          content:
            application/json:
              schema: {}
        '304':
          description: Not Modified - client can use cached version (If-None-Match
            matched)
    post:
      tags:
      - Species
      summary: Neue Fischart anlegen
      description: 'Erstellt eine neue Art. **Rolle: Admin.**'
      operationId: create_species_species__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesCreate'
        required: true
      responses:
        '201':
          description: Art erstellt
          content:
            application/json:
              schema: {}
        '409':
          description: Art existiert bereits
        '422':
          description: Validierungsfehler
      security:
      - HTTPBearer: []
  /species/{species_id}/migration:
    get:
      tags:
      - Species
      summary: Migrationszonen abrufen
      description: 'Gibt die berechnete Migrationszone für einen Monat zurück. Unterstützt
        ETag Caching. **Rolle: Gast.**'
      operationId: get_migration_zone_species__species_id__migration_get
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      - name: month
        in: query
        required: true
        schema:
          type: integer
          maximum: 12
          minimum: 1
          description: Monat (1–12)
          title: Month
        description: Monat (1–12)
      responses:
        '200':
          description: GeoJSON Feature mit Caching-Headern
          content:
            application/json:
              schema: {}
          headers:
            ETag:
              description: Weak entity tag for conditional requests (e.g., W/"abc123...")
            Cache-Control:
              description: public, max-age=86400 (cacheable for 24 hours)
        '304':
          description: Not Modified - client can use cached version (If-None-Match
            matched)
        '400':
          description: Ungültiger Monat
        '404':
          description: Art nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /species/{species_id}:
    get:
      tags:
      - Species
      summary: Einzelne Fischart abrufen
      description: 'Gibt Details einer Art mit relativen HATEOAS-Links zurück. **Rolle:
        Gast.**'
      operationId: get_species_by_id_species__species_id__get
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      responses:
        '200':
          description: Art-Details mit HATEOAS-Links
          content:
            application/json:
              schema: {}
        '404':
          description: Art nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Species
      summary: Fischart vollständig aktualisieren
      description: 'Ersetzt alle Felder einer Art. **Rolle: Admin.**'
      operationId: update_species_species__species_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesCreate'
      responses:
        '200':
          description: Art aktualisiert
          content:
            application/json:
              schema: {}
        '404':
          description: Art nicht gefunden
        '422':
          description: Validierungsfehler
    patch:
      tags:
      - Species
      summary: Fischart teilweise aktualisieren
      description: 'Aktualisiert einzelne Felder. **Rolle: Admin.**'
      operationId: patch_species_species__species_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesPatch'
      responses:
        '200':
          description: Art aktualisiert
          content:
            application/json:
              schema: {}
        '404':
          description: Art nicht gefunden
        '422':
          description: Validierungsfehler
    delete:
      tags:
      - Species
      summary: Fischart deaktivieren (Soft-Delete)
      description: 'Setzt active=False. Daten bleiben erhalten. **Rolle: Admin.**'
      operationId: delete_species_species__species_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      responses:
        '204':
          description: Deaktiviert
        '404':
          description: Art nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /marine-conditions:
    get:
      tags:
      - Marine
      summary: Marine-Bedingungen abrufen
      description: 'SST und Wellenhöhe für eine Koordinate. Parameter: lat, lng. **Rolle:
        Gast.**'
      operationId: marine_conditions_marine_conditions_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          title: Lat
      - name: lng
        in: query
        required: true
        schema:
          type: number
          title: Lng
      responses:
        '200':
          description: Marine-Daten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarineResponse'
        '400':
          description: Fehlende Koordinaten
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vessels:
    get:
      tags:
      - Vessels
      summary: Schiffe auflisten
      description: 'Optional mit bbox-Filter (lat1,lng1,lat2,lng2). **Rolle: Gast.**'
      operationId: get_vessels_vessels_get
      parameters:
      - name: bbox
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'BBox boundaries: min_lat,min_lng,max_lat,max_lng'
          title: Bbox
        description: 'BBox boundaries: min_lat,min_lng,max_lat,max_lng'
      responses:
        '200':
          description: Schiffsliste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselListResponse'
        '400':
          description: Ungültige BBox
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vessels/species/{species_id}:
    get:
      tags:
      - Vessels
      summary: Schiffe in Verbreitungszone abrufen
      description: 'Gibt alle aktuell getrackten Schiffe innerhalb der Verbreitungszone
        einer Fischart zurück. **Rolle: Gast.**'
      operationId: get_species_vessels_vessels_species__species_id__get
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      responses:
        '200':
          description: Liste der Schiffe
          content:
            application/json:
              schema: {}
        '404':
          description: Fischart nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /vessels/status:
    get:
      tags:
      - Vessels
      summary: AIS-Status abrufen
      description: 'Gibt den aktuellen Verbindungsstatus des AIS-Streams zurück. **Rolle:
        Gast.**'
      operationId: ais_status_vessels_status_get
      responses:
        '200':
          description: AIS-Verbindungsstatus
          content:
            application/json:
              schema: {}
  /vessels/{mmsi}:
    get:
      tags:
      - Vessels
      summary: Einzelnes Schiff abrufen
      description: 'Suche nach MMSI-Nummer. **Rolle: Gast.**'
      operationId: get_vessel_vessels__mmsi__get
      parameters:
      - name: mmsi
        in: path
        required: true
        schema:
          type: integer
          title: Mmsi
      responses:
        '200':
          description: Schiffsdaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselResponse'
        '404':
          description: Schiff nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /overlap:
    get:
      tags:
      - Overlap Analysis
      - Overlap Analysis
      summary: Overlap-Score berechnen
      description: 'Berechnet den Overlap-Score für eine Art und einen Monat. Parameter:
        species (Pflicht), month (Optional, Default=aktueller Monat). **Rolle: Gast.**'
      operationId: get_overlaps_overlap_get
      parameters:
      - name: species_id
        in: query
        required: true
        schema:
          type: string
          description: The species ID (e.g., 'sardina-pilchardus')
          title: Species Id
        description: The species ID (e.g., 'sardina-pilchardus')
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 12
            minimum: 1
          - type: 'null'
          description: Month context (1-12). Defaults to current month.
          title: Month
        description: Month context (1-12). Defaults to current month.
      responses:
        '200':
          description: Overlap-Ergebnis mit Scores und Zone
          content:
            application/json:
              schema: {}
        '400':
          description: Ungültiger Monat
        '404':
          description: Art oder Zone nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /overlap/{mmsi}:
    get:
      tags:
      - Overlap Analysis
      - Overlap Analysis
      summary: Overlap-Score für einzelnes Schiff
      description: 'Score eines bestimmten Schiffs gegen eine Art. Parameter: species
        (Pflicht). **Rolle: Gast.**'
      operationId: get_overlap_for_vessel_overlap__mmsi__get
      parameters:
      - name: mmsi
        in: path
        required: true
        schema:
          type: integer
          title: Mmsi
      - name: species_id
        in: query
        required: true
        schema:
          type: string
          description: The species ID (e.g., 'sardina-pilchardus')
          title: Species Id
        description: The species ID (e.g., 'sardina-pilchardus')
      responses:
        '200':
          description: Einzelner Vessel-Score
          content:
            application/json:
              schema: {}
        '404':
          description: Schiff oder Art nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /alerts:
    get:
      tags:
      - Threat Alerts
      - Threat Alerts
      summary: Aktive Warnungen abrufen
      description: 'Gibt nur Schiffe mit Score >= 0.4 zurück (WARNUNG + KRITISCH).
        Parameter: species (Pflicht). **Rolle: Gast.**'
      operationId: get_active_threat_alerts_alerts_get
      parameters:
      - name: species_id
        in: query
        required: true
        schema:
          type: string
          description: The species ID (e.g., 'sardina-pilchardus')
          title: Species Id
        description: The species ID (e.g., 'sardina-pilchardus')
      responses:
        '200':
          description: Alert-Liste (kann leer sein)
          content:
            application/json:
              schema: {}
        '404':
          description: Art nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users:
    get:
      tags:
      - Admin
      summary: Alle User auflisten
      description: '**Rolle: Admin.**'
      operationId: list_users_admin_users_get
      responses:
        '200':
          description: User-Liste
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                type: array
                title: Response List Users Admin Users Get
      security:
      - HTTPBearer: []
  /admin/users/{user_id}:
    delete:
      tags:
      - Admin
      summary: User löschen
      description: 'Admin kann sich nicht selbst löschen. **Rolle: Admin.**'
      operationId: delete_user_admin_users__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: User gelöscht
        '403':
          description: Selbstlöschung nicht erlaubt
        '404':
          description: User nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users/{user_id}/role:
    patch:
      tags:
      - Admin
      summary: User-Rolle ändern
      description: 'Erlaubte Rollen: guest, user, admin. **Rolle: Admin.**'
      operationId: change_role_admin_users__user_id__role_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Rolle geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Ungültige Rolle
        '404':
          description: User nicht gefunden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/system:
    get:
      tags:
      - Admin
      summary: Systemstatus abrufen
      description: 'Zeigt User-Anzahl, aktive Schiffe, gecachte Zonen, AIS-Status
        und Uptime. **Rolle: Admin.**'
      operationId: system_status_admin_system_get
      responses:
        '200':
          description: Systemstatus
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /favorites/species:
    get:
      tags:
      - Favorites
      summary: Get Favorite Species
      operationId: get_favorite_species_favorites_species_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FavoriteSpeciesResponse'
                type: array
                title: Response Get Favorite Species Favorites Species Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Favorites
      summary: Add Favorite Species
      operationId: add_favorite_species_favorites_species_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteSpeciesCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteSpeciesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /favorites/species/{species_id}:
    delete:
      tags:
      - Favorites
      summary: Remove Favorite Species
      operationId: remove_favorite_species_favorites_species__species_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: species_id
        in: path
        required: true
        schema:
          type: string
          title: Species Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /favorites/regions:
    get:
      tags:
      - Favorites
      summary: Get Favorite Regions
      operationId: get_favorite_regions_favorites_regions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FavoriteRegionResponse'
                type: array
                title: Response Get Favorite Regions Favorites Regions Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Favorites
      summary: Add Favorite Region
      operationId: add_favorite_region_favorites_regions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRegionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRegionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /favorites/regions/{region_id}:
    delete:
      tags:
      - Favorites
      summary: Remove Favorite Region
      operationId: remove_favorite_region_favorites_regions__region_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: region_id
        in: path
        required: true
        schema:
          type: integer
          title: Region Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports:
    get:
      tags:
      - Reports
      summary: Get Reports
      operationId: get_reports_reports_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReportResponse'
                type: array
                title: Response Get Reports Reports Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Reports
      summary: Create Report
      operationId: create_report_reports_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /reports/compare:
    get:
      tags:
      - Reports
      summary: Compare Reports
      operationId: compare_reports_reports_compare_get
      security:
      - HTTPBearer: []
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: string
          title: Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports/{report_id}:
    get:
      tags:
      - Reports
      summary: Get Report
      operationId: get_report_reports__report_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Reports
      summary: Delete Report
      operationId: delete_report_reports__report_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: integer
          title: Report Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /:
    get:
      tags:
      - Root
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    FavoriteRegionCreate:
      properties:
        name:
          type: string
          title: Name
        bbox:
          items:
            type: number
          type: array
          title: Bbox
      type: object
      required:
      - name
      - bbox
      title: FavoriteRegionCreate
    FavoriteRegionResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        user_id:
          type: integer
          title: User Id
        bbox:
          items:
            type: number
          type: array
          title: Bbox
      type: object
      required:
      - id
      - name
      - user_id
      - bbox
      title: FavoriteRegionResponse
    FavoriteSpeciesCreate:
      properties:
        species_id:
          type: string
          title: Species Id
      type: object
      required:
      - species_id
      title: FavoriteSpeciesCreate
    FavoriteSpeciesResponse:
      properties:
        id:
          type: integer
          title: Id
        species_id:
          type: string
          title: Species Id
        user_id:
          type: integer
          title: User Id
      type: object
      required:
      - id
      - species_id
      - user_id
      title: FavoriteSpeciesResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MarineResponse:
      properties:
        lat:
          type: number
          title: Lat
        lng:
          type: number
          title: Lng
        sea_surface_temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Sea Surface Temperature
      type: object
      required:
      - lat
      - lng
      title: MarineResponse
    ReportCreate:
      properties:
        species_id:
          type: string
          title: Species Id
        month:
          type: integer
          title: Month
