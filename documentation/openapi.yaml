components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    MarineResponse:
      properties:
        lat:
          title: Lat
          type: number
        lng:
          title: Lng
          type: number
        sea_surface_temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Sea Surface Temperature
      required:
      - lat
      - lng
      title: MarineResponse
      type: object
    RoleUpdate:
      properties:
        role:
          enum:
          - guest
          - user
          - admin
          title: Role
          type: string
      required:
      - role
      title: RoleUpdate
      type: object
    SpeciesCreate:
      properties:
        active:
          default: true
          title: Active
          type: boolean
        common_name:
          title: Common Name
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: string
        radius_km:
          default: 200
          title: Radius Km
          type: integer
        region:
          title: Region
          type: string
        scientific_name:
          title: Scientific Name
          type: string
        temp_max:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Max
        temp_mid:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Mid
        temp_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Min
        temp_range:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Range
      required:
      - common_name
      - scientific_name
      - region
      - id
      title: SpeciesCreate
      type: object
    SpeciesPatch:
      properties:
        active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
        common_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Common Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        radius_km:
          anyOf:
          - type: integer
          - type: 'null'
          title: Radius Km
        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
        scientific_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Scientific Name
        temp_max:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Max
        temp_mid:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Mid
        temp_min:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Min
        temp_range:
          anyOf:
          - type: number
          - type: 'null'
          title: Temp Range
      title: SpeciesPatch
      type: object
    SyncRequest:
      properties:
        name:
          title: Name
          type: string
      required:
      - name
      title: SyncRequest
      type: object
    UserResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        firebase_uid:
          title: Firebase Uid
          type: string
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        role:
          title: Role
          type: string
      required:
      - id
      - firebase_uid
      - email
      - name
      - role
      - created_at
      title: UserResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VesselListResponse:
      properties:
        count:
          title: Count
          type: integer
        vessels:
          items:
            $ref: '#/components/schemas/VesselResponse'
          title: Vessels
          type: array
      required:
      - vessels
      - count
      title: VesselListResponse
      type: object
    VesselResponse:
      properties:
        cog:
          anyOf:
          - type: number
          - type: 'null'
          title: Cog
        last_update:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Update
        lat:
          anyOf:
          - type: number
          - type: 'null'
          title: Lat
        lng:
          anyOf:
          - type: number
          - type: 'null'
          title: Lng
        mmsi:
          title: Mmsi
          type: integer
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        sog:
          anyOf:
          - type: number
          - type: 'null'
          title: Sog
      required:
      - mmsi
      title: VesselResponse
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: Backend for monitoring maritime conservation zones
  title: OceanGuard API
  version: 1.0.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
      tags:
      - Root
  /admin/system:
    get:
      description: 'Zeigt User-Anzahl, aktive Schiffe, gecachte Zonen, AIS-Status
        und Uptime. **Rolle: Admin.**'
      operationId: system_status_admin_system_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Systemstatus
      security:
      - HTTPBearer: []
      summary: Systemstatus abrufen
      tags:
      - Admin
  /admin/users:
    get:
      description: '**Rolle: Admin.**'
      operationId: list_users_admin_users_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Admin Users Get
                type: array
          description: User-Liste
      security:
      - HTTPBearer: []
      summary: Alle User auflisten
      tags:
      - Admin
  /admin/users/{user_id}:
    delete:
      description: 'Admin kann sich nicht selbst löschen. **Rolle: Admin.**'
      operationId: delete_user_admin_users__user_id__delete
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          title: User Id
          type: integer
      responses:
        '204':
          description: User gelöscht
        '403':
          description: Selbstlöschung nicht erlaubt
        '404':
          description: User nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: User löschen
      tags:
      - Admin
  /admin/users/{user_id}/role:
    patch:
      description: 'Erlaubte Rollen: guest, user, admin. **Rolle: Admin.**'
      operationId: change_role_admin_users__user_id__role_patch
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          title: User Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: Rolle geändert
        '400':
          description: Ungültige Rolle
        '404':
          description: User nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: User-Rolle ändern
      tags:
      - Admin
  /api/alerts:
    get:
      description: 'Gibt nur Schiffe mit Score >= 0.4 zurück (WARNUNG + KRITISCH).
        Parameter: species (Pflicht). **Rolle: Gast.**'
      operationId: get_active_threat_alerts_api_alerts_get
      parameters:
      - description: The species ID code (e.g., 'thunnus-thynnus')
        in: query
        name: species
        required: true
        schema:
          description: The species ID code (e.g., 'thunnus-thynnus')
          title: Species
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Alert-Liste (kann leer sein)
        '404':
          description: Art nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Aktive Warnungen abrufen
      tags:
      - Threat Alerts
      - Threat Alerts
  /api/overlap:
    get:
      description: 'Berechnet den Overlap-Score für eine Art und einen Monat. Parameter:
        species (Pflicht), month (Optional, Default=aktueller Monat). **Rolle: Gast.**'
      operationId: get_overlaps_api_overlap_get
      parameters:
      - description: The species ID (e.g., 'thunnus-thynnus')
        in: query
        name: species_id
        required: true
        schema:
          description: The species ID (e.g., 'thunnus-thynnus')
          title: Species Id
          type: string
      - description: Month context (1-12). Defaults to current month.
        in: query
        name: month
        required: false
        schema:
          anyOf:
          - maximum: 12
            minimum: 1
            type: integer
          - type: 'null'
          description: Month context (1-12). Defaults to current month.
          title: Month
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Overlap-Ergebnis mit Scores und Zone
        '400':
          description: Ungültiger Monat
        '404':
          description: Art oder Zone nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Overlap-Score berechnen
      tags:
      - Overlap Analysis
      - Overlap Analysis
  /api/overlap/{mmsi}:
    get:
      description: 'Score eines bestimmten Schiffs gegen eine Art. Parameter: species
        (Pflicht). **Rolle: Gast.**'
      operationId: get_overlap_for_vessel_api_overlap__mmsi__get
      parameters:
      - in: path
        name: mmsi
        required: true
        schema:
          title: Mmsi
          type: integer
      - description: The species ID (e.g., 'thunnus-thynnus')
        in: query
        name: species_id
        required: true
        schema:
          description: The species ID (e.g., 'thunnus-thynnus')
          title: Species Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Einzelner Vessel-Score
        '404':
          description: Schiff oder Art nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Overlap-Score für einzelnes Schiff
      tags:
      - Overlap Analysis
      - Overlap Analysis
  /auth/logout:
    post:
      description: 'Loggt den User aus. **Rolle: User/Admin.**'
      operationId: logout_auth_logout_post
      responses:
        '204':
          description: Erfolgreich ausgeloggt
        '401':
          description: Nicht eingeloggt
      security:
      - HTTPBearer: []
      summary: Logout
      tags:
      - Auth
  /auth/me:
    get:
      description: 'Gibt den eingeloggten User zurück. **Rolle: User/Admin.**'
      operationId: get_me_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User-Daten
        '401':
          description: Nicht eingeloggt
      security:
      - HTTPBearer: []
      summary: Aktuellen User abrufen
      tags:
      - Auth
  /auth/sync:
    post:
      description: 'Verifiziert Firebase-Token und erstellt/aktualisiert User in lokaler
        DB. **Rolle: Alle mit gültigem Token.**'
      operationId: sync_user_auth_sync_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: User existiert bereits
        '201':
          description: Neuer User erstellt
        '401':
          description: Token ungültig
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Firebase-User synchronisieren
      tags:
      - Auth
  /marine-conditions:
    get:
      description: 'SST und Wellenhöhe für eine Koordinate. Parameter: lat, lng. **Rolle:
        Gast.**'
      operationId: marine_conditions_marine_conditions_get
      parameters:
      - in: query
        name: lat
        required: true
        schema:
          title: Lat
          type: number
      - in: query
        name: lng
        required: true
        schema:
          title: Lng
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarineResponse'
          description: Marine-Daten
        '400':
          description: Fehlende Koordinaten
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Marine-Bedingungen abrufen
      tags:
      - Marine
  /species/:
    get:
      description: 'Gibt alle aktiven Arten zurück. **Rolle: Gast (kein Login nötig).**'
      operationId: get_all_species_species__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Liste aller aktiven Arten
      summary: Alle aktiven Fischarten abrufen
      tags:
      - Species
    post:
      description: 'Erstellt eine neue Art. **Rolle: Admin.**'
      operationId: create_species_species__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Art erstellt
        '409':
          description: Art existiert bereits
        '422':
          description: Validierungsfehler
      security:
      - HTTPBearer: []
      summary: Neue Fischart anlegen
      tags:
      - Species
  /species/{species_id}:
    delete:
      description: 'Setzt active=False. Daten bleiben erhalten. **Rolle: Admin.**'
      operationId: delete_species_species__species_id__delete
      parameters:
      - in: path
        name: species_id
        required: true
        schema:
          title: Species Id
          type: string
      responses:
        '204':
          description: Deaktiviert
        '404':
          description: Art nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Fischart deaktivieren (Soft-Delete)
      tags:
      - Species
    get:
      description: 'Gibt Details einer Art zurück. **Rolle: Gast.**'
      operationId: get_species_by_id_species__species_id__get
      parameters:
      - in: path
        name: species_id
        required: true
        schema:
          title: Species Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Art-Details
        '404':
          description: Art nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Einzelne Fischart abrufen
      tags:
      - Species
    patch:
      description: 'Aktualisiert einzelne Felder. **Rolle: Admin.**'
      operationId: patch_species_species__species_id__patch
      parameters:
      - in: path
        name: species_id
        required: true
        schema:
          title: Species Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Art aktualisiert
        '404':
          description: Art nicht gefunden
        '422':
          description: Validierungsfehler
      security:
      - HTTPBearer: []
      summary: Fischart teilweise aktualisieren
      tags:
      - Species
    put:
      description: 'Ersetzt alle Felder einer Art. **Rolle: Admin.**'
      operationId: update_species_species__species_id__put
      parameters:
      - in: path
        name: species_id
        required: true
        schema:
          title: Species Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Art aktualisiert
        '404':
          description: Art nicht gefunden
        '422':
          description: Validierungsfehler
      security:
      - HTTPBearer: []
      summary: Fischart vollständig aktualisieren
      tags:
      - Species
  /species/{species_id}/migration:
    get:
      description: 'Gibt die berechnete Migrationszone für einen Monat zurück. **Rolle:
        Gast.**'
      operationId: get_migration_zone_species__species_id__migration_get
      parameters:
      - in: path
        name: species_id
        required: true
        schema:
          title: Species Id
          type: string
      - description: Monat (1–12)
        in: query
        name: month
        required: true
        schema:
          description: Monat (1–12)
          maximum: 12
          minimum: 1
          title: Month
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: GeoJSON Feature
        '400':
          description: Ungültiger Monat
        '404':
          description: Art nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Migrationszonen abrufen
      tags:
      - Species
  /vessels:
    get:
      description: 'Optional mit bbox-Filter (lat1,lng1,lat2,lng2). **Rolle: Gast.**'
      operationId: get_vessels_vessels_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselListResponse'
          description: Schiffsliste
        '400':
          description: Ungültige BBox
      summary: Schiffe auflisten
      tags:
      - Vessels
  /vessels/species/{species_id}:
    get:
      description: 'Gibt alle aktuell getrackten Schiffe innerhalb der Verbreitungszone
        einer Fischart zurück. **Rolle: Gast.**'
      operationId: get_species_vessels_vessels_species__species_id__get
      parameters:
      - in: path
        name: species_id
        required: true
        schema:
          title: Species Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Liste der Schiffe
        '404':
          description: Fischart nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Schiffe in Verbreitungszone abrufen
      tags:
      - Vessels
  /vessels/status:
    get:
      description: 'Gibt den aktuellen Verbindungsstatus des AIS-Streams zurück. **Rolle:
        Gast.**'
      operationId: ais_status_vessels_status_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: AIS-Verbindungsstatus
      summary: AIS-Status abrufen
      tags:
      - Vessels
  /vessels/{mmsi}:
    get:
      description: 'Suche nach MMSI-Nummer. **Rolle: Gast.**'
      operationId: get_vessel_vessels__mmsi__get
      parameters:
      - in: path
        name: mmsi
        required: true
        schema:
          title: Mmsi
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselResponse'
          description: Schiffsdaten
        '404':
          description: Schiff nicht gefunden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Einzelnes Schiff abrufen
      tags:
      - Vessels
